spring.application.name=backend

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/chatapp
spring.datasource.username=chatapp
spring.datasource.password=chatapp_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
# HS256 secret (>= 32 bytes). Supply via the JWT_SECRET environment variable.
# If unset, an ephemeral random key is generated at startup (tokens won't survive
# a restart) — acceptable for local dev only. NEVER commit a real secret here.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# --- TLS / HTTPS ---
# Honour X-Forwarded-* from a TLS-terminating reverse proxy so the app knows when
# a request arrived over HTTPS (needed for correct redirects, secure WebSockets, HSTS).
server.forward-headers-strategy=framework
# Set REQUIRE_HTTPS=true in any deployed environment to force HTTP->HTTPS redirects.
# Leave false for local plain-HTTP dev.
app.security.require-https=${REQUIRE_HTTPS:false}
# To serve TLS directly (instead of behind a proxy), provide a keystore and uncomment:
#   server.ssl.enabled=true
#   server.ssl.key-store=classpath:keystore.p12
#   server.ssl.key-store-type=PKCS12
#   server.ssl.key-store-password=${KEYSTORE_PASSWORD}

# --- Image uploads ---
# Encrypted blob + per-recipient key envelopes ride in one multipart request;
# headroom over the 5MB client-side plaintext cap covers AEAD + envelope overhead.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=12MB

# --- Messages ---
# How long messages live before being dropped (24 hours).
app.messages.ttl-hours=24
# How often the purge job runs (15 minutes).
app.messages.purge-rate-ms=900000

# --- Groups ---
app.groups.max-members=32

# --- CORS / frontend (comma-separated) ---
app.cors.allowed-origin=http://localhost:5173,http://127.0.0.1:5173
